name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NOTES_DB_HOST: 127.0.0.1
  NOTES_DB_PORT: 3306
  NOTES_DB_USER: root
  NOTES_DB_PASSWORD: notes_dev_root_pw
  NOTES_DB_NAME: notes_web
  JWT_SECRET: ci-test-secret-not-for-production-use

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: notes_dev_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pnotes_dev_root_pw --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 para igualar el entorno local real (los tests se validan
          # ahí): jsdom 30 exige Node >=22.22 y @testing-library/jest-dom 7
          # exige Node >=22 — con Node 20 el job de frontend falla al arrancar
          # Vitest aunque `npm ci` instale sin quejarse.
          node-version: '24'

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pnotes_dev_root_pw --silent; then
              echo "MySQL is up"
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Apply schema (001_init + 002_add_users)
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pnotes_dev_root_pw < db/migrations/001_init.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -pnotes_dev_root_pw notes_web < db/migrations/002_add_users.sql

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests (Jest + Supertest against real MySQL)
        working-directory: backend
        run: npm test

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 para igualar el entorno local real (los tests se validan
          # ahí): jsdom 30 exige Node >=22.22 y @testing-library/jest-dom 7
          # exige Node >=22 — con Node 20 el job de frontend falla al arrancar
          # Vitest aunque `npm ci` instale sin quejarse.
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests (Vitest + RTL + msw)
        working-directory: frontend
        run: npm test

  # Deploy del frontend a S3 + CloudFront (feature 20, `aws_deploy`).
  #
  # `needs` obliga a que ambos jobs de tests estén verdes: el gate de la
  # feature 17 sigue intacto y este job nunca puede desplegar sobre tests
  # rojos. Solo corre en push a main (en un PR el token OIDC tendría un
  # `sub` distinto al que confía el rol y fallaría por diseño).
  #
  # La guarda `vars.AWS_DEPLOY_ENABLED == 'true'` existe porque la infra AWS
  # de esta feature es evidencia temporal: al hacer el teardown se pone esa
  # variable de repositorio en `false` y el job se salta limpiamente, sin
  # dejar el CI rojo apuntando a recursos que ya no existen. El job queda en
  # el repo como parte de la evidencia documentada.
  deploy-frontend-aws:
    needs: [backend-tests, frontend-tests]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    # OIDC en vez de access keys de larga vida guardadas como secrets: GitHub
    # emite un token efímero que AWS canjea por credenciales temporales.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 'Build frontend (same-origin: la API va detrás del mismo CloudFront)'
        working-directory: frontend
        # VITE_API_BASE_URL vacío hace que `httpClient.ts` emita rutas
        # relativas (`/notes`, `/auth/...`), que CloudFront enruta al origin
        # EC2. Así no hay mixed content (página HTTPS → API HTTP) ni CORS.
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Sync build to S3
        run: aws s3 sync frontend/dist "s3://${{ vars.AWS_FRONTEND_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
